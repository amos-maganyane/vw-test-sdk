packages:
  - 'packages/*'
  - 'examples/*'
  # External test project — lives in its OWN git repo
  # (https://github.com/amos-maganyane/test-vs-playwright), sibling of this
  # workspace. The relative-up path keeps `workspace:*` resolution working
  # until the SDK packages are published; remove this glob once they ship.
  - '../test-vs-playwright'

# pnpm v11.9 build-script approval (pnpm scaffolds this `allowBuilds` map itself).
# esbuild is vitest's transform engine; it ships a prebuilt platform binary so its
# postinstall is harmless. Setting true clears ERR_PNPM_IGNORED_BUILDS (which would
# otherwise make `pnpm install` exit 1 and fail CI).
allowBuilds:
  esbuild: true
  # Deny Playwright's browser-download postinstall: this SDK drives VisualWorks
  # over the bridge, not a browser, so no Chromium/Firefox/WebKit binaries are
  # needed. `false` both skips the heavy download AND clears ERR_PNPM_IGNORED_BUILDS.
  playwright: false
  playwright-core: false
